name: Publish to npm
on:
  push:
    tags:
      - "v*"              # e.g. v0.2.0
  # Re-run a failed publish for an existing tag without re-tagging:
  #   gh workflow run publish.yml --ref v0.2.0
  workflow_dispatch:

permissions:
  contents: read
  id-token: write        # npm trusted publishing (OIDC) + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history to check branch info

      - name: Check if tag is from main branch
        id: check_branch
        run: |
          # Check if the commit that the tag points to is on main branch
          if git merge-base --is-ancestor ${{ github.sha }} origin/main; then
            echo "is_main_branch=true" >> $GITHUB_OUTPUT
          else
            echo "is_main_branch=false" >> $GITHUB_OUTPUT
            echo "::warning::Tag ${{ github.ref_name }} (${{ github.sha }}) is not an ancestor of origin/main - skipping publish. Tag a commit on main instead."
          fi

      # No registry-url here on purpose: setup-node would then write an
      # `_authToken=${NODE_AUTH_TOKEN}` line to .npmrc, and an (empty) token
      # config shadows trusted publishing.
      - uses: actions/setup-node@v4
        if: steps.check_branch.outputs.is_main_branch == 'true'
        with:
          node-version: 22
          cache: "npm"

      # Trusted publishing needs npm >= 11.5.1; Node 22 ships npm 10.
      - name: Update npm
        if: steps.check_branch.outputs.is_main_branch == 'true'
        run: npm install -g npm@^11

      - run: npm ci
        if: steps.check_branch.outputs.is_main_branch == 'true'

      # Gates, as separate steps so the Actions UI says which one failed.
      # prepublishOnly repeats them, so a local `npm publish` cannot skip them.
      - name: Lint
        if: steps.check_branch.outputs.is_main_branch == 'true'
        run: npm run lint

      - name: Test
        if: steps.check_branch.outputs.is_main_branch == 'true'
        run: npm run test:run

      - name: Build
        if: steps.check_branch.outputs.is_main_branch == 'true'
        run: npm run build

      - name: Validate the package that will be published
        if: steps.check_branch.outputs.is_main_branch == 'true'
        run: npm run check:package

      # Renders every documentation route against the freshly built package —
      # the closest thing to installing it and using it.
      - name: Smoke-test the built package
        if: steps.check_branch.outputs.is_main_branch == 'true'
        run: npm run test:playground

      # Authenticates through npm trusted publishing: this repository and this
      # workflow file are registered as a Trusted Publisher for @pearpages/modals
      # on npmjs.com. No token; provenance is attached automatically.
      - name: Publish
        if: steps.check_branch.outputs.is_main_branch == 'true'
        run: npm publish --access public --loglevel verbose
