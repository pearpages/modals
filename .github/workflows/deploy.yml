
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for deployment'
        required: false
        default: 'Manual deployment'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      # One install covers the workspace: the playground is installed too.
      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm run test:run

      # Must precede the playground build: the playground resolves the package
      # through its exports map into dist/, which a fresh checkout has not built.
      - name: Build library
        run: npm run build

      - name: Build playground
        run: npm run build -w playground

      # Renders every documentation route against the built package, so a
      # broken exports map or a page that throws fails here, not after deploy.
      - name: Test the playground against the built package
        run: npm run test:playground

      # Real browsers against the built site: focus trap, inert page, scroll
      # lock, stacking, controlled dismissal, phone layout, and an axe scan of
      # every route. See playground/e2e.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Browser tests
        run: npm run e2e -w playground
      
      - name: Setup Pages
        uses: actions/configure-pages@v5
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './playground/dist'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4